<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F1E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slate">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Slate</title>
<style>
:root{
  --paper:#F4F1E6;      /* parchment ground */
  --paper2:#EAE4D2;
  --card:#FCFBF5;
  --ink:#1E2A1D;
  --mute:#78826E;
  --line:#E3DCC9;
  --green:#2F5638;      /* drawing ink */
  --deep:#1E4A2C;       /* filled buttons */
  --green2:#2C6039;
  --leaf:#5C8C42;
  --tomato:#BE3527;
  --clay:#B0674A;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:16px;
  --shadow:0 1px 2px rgba(31,42,29,.05),0 8px 24px -12px rgba(31,42,29,.18);
  color-scheme:only light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--sans);
  padding-bottom:calc(40px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- masthead: a painted plate on the page ---------- */
.plate{padding:calc(10px + env(safe-area-inset-top)) 0 0}
.vine{margin:0 -4px -6px}
.vine svg{display:block;width:100%;height:auto}
.top{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:14px}
.mark{font:400 30px/1 var(--serif);letter-spacing:.12em;color:var(--green)}
.gear{color:var(--mute);padding:6px;border-radius:9px;display:grid;place-items:center}
.gear svg{width:20px;height:20px;display:block}
.gear[aria-pressed=true]{background:var(--paper2);color:var(--green)}
.rule{height:1px;background:var(--line)}

/* ---------- capture ---------- */
.capwrap{padding-top:16px}
.cap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;
  display:flex;gap:9px;align-items:flex-end;box-shadow:0 1px 2px rgba(31,42,29,.04)}
#box{flex:1;min-height:46px;max-height:190px;padding:11px 12px;resize:none;color:var(--ink);
  background:transparent;border:0;line-height:1.4}
#box::placeholder{color:#9AA391}
#box:focus{outline:0}
.iconbtn{width:44px;height:44px;flex:none;border-radius:12px;background:var(--paper2);
  display:grid;place-items:center;color:var(--green)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{background:var(--tomato);color:#fff}
#add{height:44px;padding:0 20px;flex:none;border-radius:12px;background:var(--deep);color:#F3F0E4;
  font-weight:600;letter-spacing:.01em}
#flash{font-size:13px;color:var(--mute);padding:9px 4px 0;min-height:0}
#flash b{color:var(--ink)}

/* ---------- tabs ---------- */
nav{display:flex;gap:24px;padding:18px 4px 2px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line)}
nav::-webkit-scrollbar{display:none}
nav button{padding:4px 0 10px;font:500 14.5px/1 var(--serif);letter-spacing:.04em;color:var(--mute);
  white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
nav button[aria-selected=true]{color:var(--green);border-bottom-color:var(--tomato)}

/* ---------- filters ---------- */
.filters{padding:14px 0 2px}
.frow{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:500;
  background:transparent;color:var(--mute);white-space:nowrap;border:1px solid var(--line);
  display:flex;align-items:center;gap:7px}
.chip[aria-pressed=true]{background:var(--deep);color:#F3F0E4;border-color:var(--deep)}
.chip .dot{width:8px;height:8px}

/* ---------- sections ---------- */
h2.sec{font:400 13px/1 var(--serif);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);
  margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2.sec span{letter-spacing:.02em;text-transform:none;font-family:var(--sans);font-size:12px}
h2.sec.late{color:var(--tomato)}
.list{display:flex;flex-direction:column;gap:8px}

/* ---------- rows ---------- */
.row{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row.over{box-shadow:inset 3px 0 0 var(--tomato),var(--shadow)}
.rmain{display:flex;gap:12px;padding:14px;align-items:flex-start}
.tick{width:24px;height:24px;flex:none;margin-top:2px;border-radius:50%;
  border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent;
  transition:border-color .15s,color .15s}
.tick:hover,.tick:active{border-color:var(--leaf);color:var(--leaf)}
.rbody{flex:1;min-width:0}
.rtitle{font-weight:600;line-height:1.35;word-wrap:break-word;font-size:15.5px;letter-spacing:-.005em}
.meta{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;margin-top:7px;font-size:12.5px;color:var(--mute)}
/* category marks are leaves, not dots */
.dot{width:9px;height:9px;flex:none;border-radius:0 100% 0 100%;transform:rotate(-20deg)}
.pill{background:var(--paper2);border-radius:6px;padding:2px 8px;font-weight:600;font-size:11.5px}
.pill.learn{color:var(--leaf)}
.pill.late{background:var(--tomato);color:#fff}
.more{width:28px;flex:none;align-self:stretch;color:var(--mute);font-size:18px;line-height:1}

/* ---------- tray + editor ---------- */
.tray{border-top:1px solid var(--line);padding:13px 14px;background:var(--paper)}
.tray p{margin:0 0 10px;font-size:12.5px;color:var(--mute)}
.mins{display:flex;flex-wrap:wrap;gap:6px}
.mins button{padding:8px 13px;border-radius:10px;background:var(--card);font-size:14px;font-weight:600;
  border:1px solid var(--line)}
.mins button.on{border-color:var(--leaf);color:var(--green)}
.mins button.skip{color:var(--mute);font-weight:500}
.mins button.drained{color:var(--tomato)}
.mins button.better{color:var(--leaf)}
.tray .step{display:flex;gap:8px;align-items:baseline;margin:0 0 10px}
.tray .step b{font:400 14px/1.3 var(--serif);color:var(--ink)}
.tray .step i{font-style:normal;font-size:11.5px;color:var(--mute)}
.edit{border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.edit label{font:600 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
  display:block;margin-bottom:6px}
.edit input,.edit select{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.two{display:flex;gap:8px}.two>div{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{padding:6px 11px;border-radius:9px;background:var(--card);border:1px solid var(--line);
  font-size:13px;font-weight:600}
.chips button[aria-pressed=true]{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.editfoot{display:flex;gap:8px;justify-content:space-between;align-items:center}
.save{padding:10px 19px;border-radius:10px;background:var(--deep);color:#F3F0E4;font-weight:600}
.del{color:var(--tomato);font-size:13.5px;font-weight:600}
.btn{padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  font-weight:600;font-size:13px}

/* ---------- calendar: planting beds ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:18px 0 14px}
.calhead b{font:400 21px/1 var(--serif);letter-spacing:.03em;color:var(--green)}
.calnav{display:flex;gap:6px}
.calnav button{width:36px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:440px}
.gh{text-align:center;font:600 10px/1 var(--sans);letter-spacing:.14em;color:var(--mute);padding-bottom:7px}
.cell{position:relative;aspect-ratio:1;max-height:62px;border-radius:10px;background:var(--card);
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:12.5px;color:var(--mute);overflow:hidden}
.cell.out{opacity:.35;background:transparent;border-color:transparent}
.cell.today{border-color:var(--deep);border-width:1.5px}
.cell[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#F3F0E4}
.cell .n{font-weight:600;position:relative;z-index:2}
.cell .fill{position:absolute;left:0;right:0;bottom:0;background:var(--leaf);opacity:.28;z-index:1}
.cell .marks{display:flex;gap:3px;position:relative;z-index:2}
.cell .m{width:4px;height:4px;border-radius:50%}
.m.done{background:var(--leaf)}
.m.due{background:var(--tomato)}
.cell[aria-pressed=true] .m.done{background:#F3F0E4}
.dayhead{font:400 19px/1 var(--serif);color:var(--green);margin:24px 0 10px}

/* ---------- review ---------- */
.stats{display:flex;gap:8px;margin:18px 0 4px}
.stat{flex:1;background:var(--card);border-radius:var(--r);padding:15px 10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font:400 27px/1.1 var(--serif);color:var(--green)}
.stat span{font-size:11px;color:var(--mute);display:block;margin-top:5px}
.bars{display:flex;align-items:flex-end;gap:4px;height:100px;background:var(--card);border-radius:var(--r);
  padding:12px 12px 8px;box-shadow:var(--shadow)}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bfill{width:100%;background:var(--leaf);border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
.blab{font-size:9.5px;color:var(--mute)}
table.t{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow)}
table.t td,table.t th{padding:11px 13px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
table.t th{font:600 10.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
table.t tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.bad{color:var(--tomato);font-weight:600}
.donerow{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--card);
  border-radius:var(--r);box-shadow:var(--shadow)}
.donerow .rtitle{font-weight:500;font-size:14.5px;flex:1}
.undo{font-size:12px;color:var(--mute);font-weight:600}

/* ---------- empty states get a drawing ---------- */
.empty{text-align:center;color:var(--mute);padding:16px 20px 40px;font-size:14.5px;line-height:1.65}

<script>

var KEY = qk || (function(){ try { return localStorage.getItem("slate_key"); } catch(e){ return null; } })() || "";

var S = { today:"", tasks:[], categories:[], recent:[], category_history:[], avoidance:[], settings:{} };
var view = "today";
var timeCap = 0;
var catFilter = "";

/* ---------------- helpers ---------------- */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function d2n(s){ var p = String(s).slice(0,10).split("-"); return Date.UTC(+p[0], +p[1]-1, +p[2]); }
function n2d(n){ return new Date(n).toISOString().slice(0,10); }
function addDays(s,n){ return n2d(d2n(s) + n*86400000); }
function diffDays(a,b){ return Math.round((d2n(a) - d2n(b)) / 86400000); }
function monthOf(s){ return s.slice(0,7); }
function firstOf(m){ return m + "-01"; }
function shiftMonth(m,n){
  var y = +m.slice(0,4), mo = +m.slice(5,7) - 1 + n;
  y += Math.floor(mo/12); mo = ((mo%12)+12)%12;
  return y + "-" + String(mo+1).padStart(2,"0");
}
function daysIn(m){ return new Date(Date.UTC(+m.slice(0,4), +m.slice(5,7), 0)).getUTCDate(); }
function dow(s){ return new Date(d2n(s)).getUTCDay(); }

function fmtMins(m){
  m = Math.round(m || 0);
  if (m < 60) return m + "m";
  var h = Math.floor(m/60), r = m % 60;
  return r ? h + "h " + r + "m" : h + "h";
}
function agoWords(dateStr, today){
  if (!dateStr) return "never done";
  var d = diffDays(today, dateStr);
  if (d === 0) return "done today";
  if (d === 1) return "yesterday";
  if (d < 7) return d + " days ago";
  if (d < 14) return "a week ago";
  if (d < 60) return Math.round(d/7) + " weeks ago";
  return Math.round(d/30) + " months ago";
}
function dueWords(dateStr, today){
  if (!dateStr) return "";
  var d = diffDays(dateStr, today);
  if (d < -1) return Math.abs(d) + " days late";
  if (d === -1) return "1 day late";
  if (d === 0) return "today";
  if (d === 1) return "tomorrow";
  if (d < 7) return "in " + d + " days";
  return new Date(d2n(dateStr)).toLocaleDateString(undefined,{month:"short",day:"numeric",timeZone:"UTC"});
}
function eff(t){ return (t.times_timed >= 2 && t.avg_actual) ? t.avg_actual : t.estimate_minutes; }
function isLearned(t){ return t.times_timed >= 2 && t.avg_actual != null; }
function minsOf(c){ return c.actual_minutes != null ? c.actual_minutes : (c.estimate_minutes || 0); }

  flash.innerHTML = html;

/* ---------------- rows ---------------- */
function bucketOf(t, today){
  var d = t.next_due_on || t.due_on;
  if (!d) return "anytime";
  if (d < today) return "overdue";
  if (d === today) return "today";
  if (diffDays(d, today) <= 7) return "soon";
  return "later";
}
function rowHTML(t){
  var today = S.today, e = eff(t), b = bucketOf(t, today);
  var due = t.next_due_on || t.due_on, bits = [];
  if (due) bits.push('<span class="pill' + (b==="overdue" ? " late" : "") + '">' + esc(dueWords(due, today)) + "</span>");
  bits.push('<span class="pill' + (isLearned(t) ? " learn" : "") + '">' + fmtMins(e) + (isLearned(t) ? " usually" : "") + "</span>");
  if (t.recur_mode) bits.push("&#8635; " + esc(agoWords(t.last_done_on, today)));

  return '<div class="row' + (b === "overdue" ? " over" : "") + '" data-id="' + t.id + '">' +
    '<div class="rmain">' +
      '<button class="tick" data-act="tray" title="Done">&#10003;</button>' +

function section(title, note, rows, cls){
  if (!rows.length) return "";
  return '<h2 class="sec' + (cls ? " " + cls : "") + '">' + esc(title) + (note ? "<span>" + esc(note) + "</span>" : "") + "</h2>" +
         '<div class="list">' + rows.map(rowHTML).join("") + "</div>";
}
function totalWords(rows){
  if (!rows.length) return "";
  var m = rows.reduce(function(a,t){ return a + eff(t); }, 0);
  return rows.length + " · " + fmtMins(m);
}

/* ---------------- filters ---------------- */
function filterBar(){
  var times = [[5,"5 min"],[15,"15 min"],[30,"30 min"],[60,"An hour"],[0,"Any time"]];
  var used = {};
  S.tasks.forEach(function(t){ used[t.category_name || "Unsorted"] = t.category_color; });
  var cats = S.categories.filter(function(c){ return used[c.name]; });

  return '<div class="filters">' +
    '<div class="frow" data-f="time">' + times.map(function(p){
      return '<button class="chip" data-m="' + p[0] + '" aria-pressed="' + (timeCap === p[0]) + '">' + p[1] + "</button>";
    }).join("") + "</div>" +
    (cats.length > 1 ? '<div class="frow" data-f="cat">' +
      '<button class="chip" data-c="" aria-pressed="' + (catFilter === "") + '">Everything</button>' +
      cats.map(function(c){
        return '<button class="chip" data-c="' + esc(c.name) + '" aria-pressed="' + (catFilter === c.name) + '">' +
          '<span class="dot" style="background:' + esc(c.color) + '"></span>' + esc(c.name) + "</button>";
      }).join("") + "</div>" : "") +
  "</div>";
}
function pool(){
  return S.tasks.filter(function(t){
    if (timeCap && eff(t) > timeCap) return false;
    if (catFilter && (t.category_name || "Unsorted") !== catFilter) return false;
    return true;
  });
}

/* ---------------- views ---------------- */
function renderToday(){
  var today = S.today, p = pool();
  var g = { overdue:[], today:[], soon:[], anytime:[], later:[] };
  p.forEach(function(t){ g[bucketOf(t, today)].push(t); });
  g.anytime.sort(function(a,b){ return eff(a) - eff(b); });

  var body =
    section("Late", totalWords(g.overdue), g.overdue, "late") +
    section("Today", totalWords(g.today), g.today) +
    section("This week", totalWords(g.soon), g.soon) +
    section("Whenever", totalWords(g.anytime), g.anytime) +

function renderCal(){
  var today = S.today, m = calMonth || monthOf(today);
  var doneBy = {}, dueBy = {};
  (S.recent || []).forEach(function(c){ (doneBy[c.done_on] = doneBy[c.done_on] || []).push(c); });
  S.tasks.forEach(function(t){
    var d = t.next_due_on || t.due_on;
    if (d) (dueBy[d] = dueBy[d] || []).push(t);
  });

  var first = firstOf(m), lead = dow(first), n = daysIn(m);
  var maxMin = 1;
  Object.keys(doneBy).forEach(function(d){
    if (monthOf(d) === m) {
      var s = doneBy[d].reduce(function(a,c){ return a + minsOf(c); }, 0);
      if (s > maxMin) maxMin = s;
    }
  });

  var cells = "";
  for (var i = 0; i < lead; i++) {
    var pd = addDays(first, i - lead);
    cells += '<div class="cell out"><span class="n">' + (+pd.slice(8,10)) + "</span></div>";
  }
  for (var d = 1; d <= n; d++) {
    var ds = m + "-" + String(d).padStart(2,"0");
    var dn = doneBy[ds] || [], du = dueBy[ds] || [];
    var mins = dn.reduce(function(a,c){ return a + minsOf(c); }, 0);
    var h = mins ? Math.max(14, Math.round(mins / maxMin * 100)) : 0;
    var marks = "";
    if (dn.length) marks += '<span class="m done"></span>';
    if (du.length) marks += '<span class="m due"></span>';
    cells += '<button class="cell' + (ds === today ? " today" : "") + '" data-act="day" data-d="' + ds + '"' +
      ' aria-pressed="' + (calDay === ds) + '">' +
      (h ? '<span class="fill" style="height:' + h + '%"></span>' : "") +
      '<span class="n">' + d + "</span>" +
      '<span class="marks">' + marks + "</span></button>";
  }
  var tail = (7 - ((lead + n) % 7)) % 7;
  for (var j = 1; j <= tail; j++) cells += '<div class="cell out"><span class="n">' + j + "</span></div>";

  var label = new Date(d2n(first)).toLocaleDateString(undefined,{month:"long",year:"numeric",timeZone:"UTC"});
  var head = '<div class="calhead"><b>' + esc(label) + "</b><div class=\"calnav\">" +
    '<button data-act="mon" data-n="-1">&#8249;</button>' +
    '<button data-act="mon" data-n="1">&#8250;</button></div></div>';
  var ghs = ["S","M","T","W","T","F","S"].map(function(x){ return '<div class="gh">' + x + "</div>"; }).join("");

  var detail = "";
  if (calDay) {
    var dn2 = doneBy[calDay] || [], du2 = dueBy[calDay] || [];
    var nice = new Date(d2n(calDay)).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",timeZone:"UTC"});
    detail = '<div class="dayhead">' + esc(nice) + "</div>";
    if (!dn2.length && !du2.length) detail += '<div class="empty">Nothing done, nothing due.</div>';
    if (dn2.length) detail += '<h2 class="sec">Finished<span>' + fmtMins(dn2.reduce(function(a,c){return a+minsOf(c);},0)) + "</span></h2>" +
      '<div class="list">' + dn2.map(function(c){
        return '<div class="donerow"><div class="rtitle">' + esc(c.title) +
          '<div class="meta"><span class="pill">' + (c.actual_minutes == null ? "not timed" : fmtMins(c.actual_minutes)) + "</span></div></div></div>";
      }).join("") + "</div>";
    if (du2.length) detail += '<h2 class="sec">Due</h2><div class="list">' + du2.map(rowHTML).join("") + "</div>";
  }

  $("#v-cal").innerHTML = head + '<div class="grid">' + ghs + cells + "</div>" + detail;
}

/* how many times a year this actually lands on her */
function perYear(t){
  if (t.recur_mode === "floating" && t.recur_interval_days) return 365 / t.recur_interval_days;
  if (t.recur_mode === "fixed") {
    var r = t.recur_rule || "";
    if (/^daily/.test(r)) return 365;
    var m = r.match(/^every:(\d+)/); if (m) return 365 / Math.max(1, +m[1]);
    if (/^weekly:/.test(r)) return 52 * Math.max(1, r.slice(7).split(",").filter(Boolean).length);
    if (/^monthly:/.test(r)) return 12;
    if (/^yearly:/.test(r)) return 1;
  }
  return 1;
}
/* how it has felt, from the completions we have */
function feelOf(taskId){
  var d=0,f=0,b=0;
  (S.recent||[]).forEach(function(c){
    if (c.task_id !== taskId) return;
    if (c.energy === "drained") d++; else if (c.energy === "fine") f++; else if (c.energy === "better") b++;
  });
  var n=d+f+b;
  return { n:n, drain: n ? d/n : 0, lift: n ? b/n : 0 };
}
function hrs(mins){
  var hh = mins/60;
  if (hh < 1) return Math.round(mins) + "m";
  return (hh < 10 ? hh.toFixed(1) : Math.round(hh)) + "h";
}

function renderReview(){
  var today = S.today, r = S.recent || [];
  var todayRows = r.filter(function(c){ return c.done_on === today; });
  var days = {}; r.forEach(function(c){ days[c.done_on] = true; });
  var streak = 0, cur = days[today] ? today : addDays(today, -1);
  while (days[cur]) { streak++; cur = addDays(cur, -1); }

  var html = '<div class="stats">' +
    '<div class="stat"><b>' + todayRows.length + "</b><span>done today</span></div>" +
    '<div class="stat"><b>' + fmtMins(todayRows.reduce(function(a,c){return a+minsOf(c);},0)) + "</b><span>logged today</span></div>" +
    '<div class="stat"><b>' + streak + "</b><span>day streak</span></div></div>";

  var bars = [], max = 1;
  for (var i = 13; i >= 0; i--) {
    var d = addDays(today, -i);
    var mn = r.filter(function(c){ return c.done_on === d; }).reduce(function(a,c){ return a + minsOf(c); }, 0);
    if (mn > max) max = mn;
    bars.push({ d:d, m:mn });
  }
  html += '<h2 class="sec">Last two weeks<span>' + fmtMins(bars.reduce(function(a,b){return a+b.m;},0)) + "</span></h2>" +
    '<div class="bars">' + bars.map(function(b){
      var h = Math.max(2, Math.round(b.m / max * 68));
      var lab = new Date(d2n(b.d)).toLocaleDateString(undefined,{weekday:"narrow",timeZone:"UTC"});
      return '<div class="bcol" title="' + b.d + ": " + fmtMins(b.m) + '"><div class="bfill" style="height:' + h + 'px"></div>' +
             '<div class="blab">' + esc(lab) + "</div></div>";
    }).join("") + "</div>";

  var av = (S.avoidance || []).filter(function(a){ return a.avg_days_late != null && a.avg_days_late > 0; });
  if (av.length) {
    html += '<h2 class="sec">What you put off longest<span>days past due</span></h2><table class="t">' +
      '<tr><th>Task</th><th class="num">Avg late</th><th class="num">Worst</th></tr>' +
      av.slice(0,12).map(function(a){
        return "<tr><td>" + esc(a.title) + '</td><td class="num bad">' + a.avg_days_late + '</td><td class="num">' + (a.worst_days_late != null ? a.worst_days_late : "—") + "</td></tr>";
      }).join("") + "</table>";
  }

  var timed = (S.avoidance || []).filter(function(a){ return a.avg_actual != null; });
  if (timed.length) {
    html += '<h2 class="sec">How long things really take<span>you vs your guess</span></h2><table class="t">' +
      '<tr><th>Task</th><th class="num">Actually</th><th class="num">Guessed</th></tr>' +
      timed.slice(0,12).map(function(a){
        var off = a.avg_estimate && Math.abs(a.avg_actual - a.avg_estimate) >= Math.max(5, a.avg_estimate * .3);
        return "<tr><td>" + esc(a.title) + '</td><td class="num' + (off ? " bad" : "") + '">' + fmtMins(a.avg_actual) +
               '</td><td class="num">' + (a.avg_estimate ? fmtMins(a.avg_estimate) : "—") + "</td></tr>";
      }).join("") + "</table>";
  }

  var ch = (S.category_history || []).filter(function(c){ return c.samples > 0; });
  if (ch.length) {
    html += '<h2 class="sec">By category</h2><table class="t">' +
      '<tr><th>Category</th><th class="num">Average</th><th class="num">Times</th></tr>' +
      ch.sort(function(a,b){ return b.samples - a.samples; }).map(function(c){
        return "<tr><td>" + esc(c.name) + '</td><td class="num">' + fmtMins(c.avg_actual) + '</td><td class="num">' + c.samples + "</td></tr>";
      }).join("") + "</table>";
  }

  /* what is worth handing off */
  var cand = S.tasks.map(function(t){
      var f = feelOf(t.id), py = perYear(t), mins = eff(t) * py;
      return { t:t, f:f, py:py, mins:mins, score: mins * (0.6 + f.drain) };
    })
    .filter(function(x){ return (x.t.delegable === "yes" || x.t.delegable === "partly") && x.mins >= 20; })
    .sort(function(a,b){ return b.score - a.score; });

  if (cand.length) {
    html += '<h2 class="sec">Worth handing off<span>hours a year</span></h2><table class="t">' +
      '<tr><th>Task</th><th class="num">A year</th><th>How it feels</th></tr>' +
      cand.slice(0,12).map(function(x){
        var note = x.f.n === 0 ? "not rated yet"
          : x.f.drain >= .5 ? "drains you" : x.f.lift >= .5 ? "you like it" : "neutral";
        return "<tr><td>" + esc(x.t.title) + (x.t.delegable === "partly" ? " <span class=\"pill\">partly</span>" : "") +
          '</td><td class="num' + (x.f.drain >= .5 ? " bad" : "") + '">' + hrs(x.mins) +
          "</td><td>" + note + "</td></tr>";
      }).join("") + "</table>";
  }

  /* and what to protect */
  var keep = S.tasks.map(function(t){ return { t:t, f:feelOf(t.id) }; })
    .filter(function(x){ return x.f.n >= 2 && x.f.lift >= .5; })
    .sort(function(a,b){ return b.f.lift - a.f.lift; });
  if (keep.length) {
    html += '<h2 class="sec">Worth keeping<span>these give something back</span></h2><table class="t">' +
      keep.slice(0,8).map(function(x){
        return "<tr><td>" + esc(x.t.title) + '</td><td class="num">' + Math.round(x.f.lift*100) + "%</td></tr>";
      }).join("") + "</table>";
  }

  var unrated = S.tasks.filter(function(t){ return !t.delegable && eff(t) * perYear(t) >= 60; }).length;
  if (unrated) {
    html += '<div class="card" style="margin-top:14px"><p style="margin:0">' + unrated +
      " task" + (unrated===1?"":"s") + " worth more than an hour a year haven't been rated for whether someone else could do them. " +
      "You'll be asked the first time you tick each one off.</p></div>";
  }

  html += '<h2 class="sec">Recently done</h2>';
  if (!r.length) html += '<div class="empty">Nothing logged yet.<br>Tick something off and it lands here.</div>';
  else html += '<div class="list">' + r.slice(0,50).map(function(c){
    var est = c.estimate_minutes, act = c.actual_minutes;
    var note = act == null ? "not timed"
      : (est && Math.abs(act - est) >= Math.max(5, est * .3) ? fmtMins(act) + " (guessed " + fmtMins(est) + ")" : fmtMins(act));
    return '<div class="donerow" data-cid="' + c.id + '"><div class="rtitle">' + esc(c.title) +
      '<div class="meta">' + esc(agoWords(c.done_on, today)) + ' <span class="pill">' + esc(note) + "</span>" +
      (c.days_late > 0 ? ' <span class="pill late">' + c.days_late + "d late</span>" : "") +
      (c.energy === "drained" ? ' <span class="pill" style="color:var(--tomato)">drained</span>' :
       c.energy === "better" ? ' <span class="pill" style="color:var(--leaf)">better</span>' : "") +
      "</div></div><button class=\"undo\" data-act=\"undo\">undo</button></div>";
  }).join("") + "</div>";

  $("#v-review").innerHTML = html;
}

function renderSetup(){
  var counts = {};
  S.tasks.forEach(function(t){ var k = t.category_name || "Unsorted"; counts[k] = (counts[k]||0)+1; });
  var hist = {}; (S.category_history||[]).forEach(function(c){ hist[c.name] = c; });
  var unsorted = S.tasks.filter(function(t){ return t.category_name === "Unsorted"; }).length;

  $("#v-setup").innerHTML =
    '<div class="card"><h3>Categories</h3>' + S.categories.map(function(c){
      var h = hist[c.name];
      return '<div class="catline"><span class="dot" style="background:' + esc(c.color) + '"></span><b>' + esc(c.name) + "</b>" +
        "<span>" + (counts[c.name]||0) + " open" + (h && h.samples ? " · usually " + fmtMins(h.avg_actual) : "") + "</span></div>";
    }).join("") + "</div>" +
    '<div class="card"><h3>Unsorted</h3><p>' + unsorted + " item" + (unsorted===1?"":"s") +
      " haven't matched a rule yet.</p><button class=\"btn\" id=\"resort\">Sort them now</button></div>" +
    '<div class="card"><h3>This device</h3>' +
      "<p>Home screen: Share → Add to Home Screen.</p>" +
      "<p>Set up another device with this link:<br><code>" + esc(location.origin + location.pathname + "?k=" + KEY) + "</code></p>" +
      '<button class="btn" id="forget">Sign out here</button></div>';

  var rs = $("#resort");
  if (rs) rs.onclick = function(){
    rs.textContent = "Sorting…";
    api({ action:"resort" }).then(function(j){ say("Sorted <b>" + j.sorted + "</b>"); return load(); })
      .catch(function(e){ say(esc(e.message)); });
  };
  var fg = $("#forget");
  if (fg) fg.onclick = function(){
    if (!confirm("Sign out of Slate on this device?")) return;
    try { localStorage.removeItem("slate_key"); } catch(e){}
    location.replace(location.pathname);
  };
}

function render(){
  ["today","list","cal","review","setup"].forEach(function(v){ $("#v-" + v).hidden = (v !== view); });
  $("#gear").setAttribute("aria-pressed", String(view === "setup"));
  [].forEach.call($("#tabs").children, function(x){ x.setAttribute("aria-selected", String(x.dataset.v === view)); });
  if (view === "today") renderToday();
  if (view === "list") renderList();
  if (view === "cal") renderCal();
  if (view === "review") renderReview();
  if (view === "setup") renderSetup();
  var mins = S.tasks.reduce(function(a,t){ return a + eff(t); }, 0);
  $("#foot").textContent = S.tasks.length + " open · " + fmtMins(mins);
}

/* ---------------- interaction ---------------- */
$("#tabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-v]");
  if (!b) return;
  view = b.dataset.v; openTray = openEdit = null; render();
});
$("#gear").onclick = function(){
  view = (view === "setup") ? "today" : "setup";
  openTray = openEdit = null; render();
};

function currentEdit(row){
  var get = function(f){ var el = row.querySelector('[data-f="' + f + '"]'); return el ? el.value : null; };
  var mode = get("recur_mode");
  var patch = {
    title: get("title"), category_id: get("category_id"),
    estimate_minutes: Math.max(1, +get("estimate_minutes") || 15),
    due_on: get("due_on") || null,
    delegable: get("delegable") || null,
    recur_mode: mode || null, recur_interval_days: null, recur_rule: null
  };
  if (mode === "floating") patch.recur_interval_days = Math.max(1, +get("recur_interval_days") || 7);
  if (mode === "fixed") {
    var kind = get("fixkind");
    if (kind === "daily") patch.recur_rule = "daily";
    else if (kind === "monthly") patch.recur_rule = "monthly:" + Math.min(31, Math.max(1, +get("mday") || 1));
    else {
      var ds = [].filter.call(row.querySelectorAll('[data-act="wday"]'), function(b){
        return b.getAttribute("aria-pressed") === "true";
      }).map(function(b){ return b.dataset.i; });
      patch.recur_rule = "weekly:" + (ds.length ? ds.join(",") : "1");
    }
  }
  return patch;
}

document.addEventListener("click", function(e){
  var chip = e.target.closest(".frow .chip");
  if (chip) {
    if (chip.parentNode.dataset.f === "time") timeCap = +chip.dataset.m;
    else catFilter = chip.dataset.c;
    render();
    return;
  }
  var btn = e.target.closest("[data-act]");
  if (!btn) return;
  var act = btn.dataset.act, row = btn.closest(".row"), id = row ? row.dataset.id : null;

  if (act === "mon") { calMonth = shiftMonth(calMonth, +btn.dataset.n); calDay = null; renderCal(); return; }
  if (act === "day") { calDay = (calDay === btn.dataset.d) ? null : btn.dataset.d; renderCal(); return; }
  if (act === "tray") { openTray = (openTray === id) ? null : id; openEdit = null; trayStep = "mins"; trayMins = trayEnergy = null; render(); return; }
  if (act === "edit") { openEdit = (openEdit === id) ? null : id; openTray = null; render(); return; }

  if (act === "done") {
    trayMins = btn.dataset.m === "" ? null : +btn.dataset.m;
    trayStep = "energy";
    render();
    return;
  }

  if (act === "energy" || act === "deleg") {
    if (busy) return;
    var task = null;
    for (var i = 0; i < S.tasks.length; i++) if (S.tasks[i].id === id) task = S.tasks[i];

    if (act === "energy") {
      trayEnergy = btn.dataset.e || null;
      if (task && !task.delegable) { trayStep = "deleg"; render(); return; }
    }
    var deleg = act === "deleg" ? (btn.dataset.d || null) : null;

    busy = true;
    var mins = trayMins, en = trayEnergy;
    openTray = null; trayStep = "mins"; trayMins = null; trayEnergy = null;

    api({ action:"complete", id:id, actual_minutes: mins, energy: en })
      .then(function(j){
        say(j.next_due_on ? "Logged. Back <b>" + esc(dueWords(j.next_due_on, S.today)) + "</b>" : "Logged.");
        if (deleg) return api({ action:"set_delegable", id:id, delegable:deleg });
      })
      .then(function(){ return load(); })
      .catch(function(err){ say(esc(err.message)); })
      .then(function(){ busy = false; });
    return;
  }
  if (act === "snooze") {
    api({ action:"snooze", id:id, days:+btn.dataset.d })
      .then(function(){ openEdit = null; return load(); }).catch(function(err){ say(esc(err.message)); });
    return;
  }
  if (act === "del") {
    if (!confirm("Delete this for good?")) return;
    api({ action:"delete_task", id:id })
      .then(function(){ openEdit = null; say("Deleted."); return load(); }).catch(function(err){ say(esc(err.message)); });
    return;
  }
  if (act === "save") {
    var patch = currentEdit(row); patch.action = "update_task"; patch.id = id;
    api(patch).then(function(){ openEdit = null; say("Saved."); return load(); }).catch(function(err){ say(esc(err.message)); });
    return;
  }
  if (act === "iv") {
    var inp = row.querySelector('[data-f="recur_interval_days"]');
    if (inp) inp.value = btn.dataset.n;
    return;
  }
  if (act === "wday") {
    btn.setAttribute("aria-pressed", btn.getAttribute("aria-pressed") === "true" ? "false" : "true");
    return;
  }
  if (act === "undo") {
    var cid = btn.closest(".donerow").dataset.cid;
    api({ action:"undo", completion_id:cid })
      .then(function(){ say("Put back."); return load(); }).catch(function(err){ say(esc(err.message)); });
    return;
  }
});

document.addEventListener("change", function(e){
  var el = e.target, row = el.closest(".row");
  if (!row) return;
  if (el.dataset.f === "recur_mode") {
    var f = row.querySelector('[data-blk="floating"]'), x = row.querySelector('[data-blk="fixed"]');
    if (f) f.hidden = el.value !== "floating";
    if (x) x.hidden = el.value !== "fixed";
  }
  if (el.dataset.f === "fixkind") {
    var w = row.querySelector('[data-blk="wdays"]'), mm = row.querySelector('[data-blk="mday"]');
    if (w) w.hidden = el.value !== "weekly";
    if (mm) mm.hidden = el.value !== "monthly";
  }
});

document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(); });

if (!KEY) {
  $("#v-today").innerHTML =
    '<div class="empty" style="text-align:left">' +
      '<p style="margin:0 0 12px"><b>One-time setup on this device.</b><br>Paste your Slate key. It stays in this browser.</p>' +
      '<div style="display:flex;gap:8px">' +
        '<input id="keyin" type="password" autocomplete="off" placeholder="key" ' +
          'style="flex:1;padding:11px 12px;border-radius:10px;border:0;background:var(--card);color:var(--ink)">' +
        '<button class="save" id="keygo">Unlock</button></div></div>';
  $("#keygo").onclick = function(){
    var v = $("#keyin").value.trim();
    if (!v) return;
    try { localStorage.setItem("slate_key", v); } catch(e){}
    location.replace(location.pathname);
  };
  $("#keyin").addEventListener("keydown", function(e){ if (e.key === "Enter") $("#keygo").click(); });
} else {
  load();
}
})();
</script>
</body>
</html>
