<title>Slate</title>
<style>
:root{
  --bg:#1E4A2E;        /* the ground: deep garden green */
  --bg2:#173B24;       /* recessed green */
  --onbg:#E4EEDD;      /* text on green */
  --onbg-dim:#A8BFA0;
  --card:#F5F2E8;      /* bone */
  --card2:#E9E4D4;     /* chip on bone */
  --ink:#1B2A1D;
  --mute:#6B7A66;
  --line:#DED8C6;
  --tomato:#C63A28;
  --clay:#B0674A;
  --leaf:#4E7A3A;
  --serif:ui-serif,"Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1F13; --bg2:#0A1810; --onbg:#D6E4CE; --onbg-dim:#7E9577;
    --card:#16291B; --card2:#1E3624; --ink:#E7EEE2; --mute:#8CA286; --line:#284631;
    --tomato:#E07A66; --clay:#C8906F; --leaf:#7FAF69;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--onbg);font:16px/1.45 var(--sans);
  padding-bottom:calc(30px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:740px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- masthead ---------- */
.top{display:flex;align-items:baseline;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
.mark{font:400 25px/1 var(--serif);letter-spacing:.06em;color:var(--onbg)}
.mark em{font-style:normal;color:var(--onbg-dim)}
.gear{font-size:19px;color:var(--onbg-dim);padding:4px 6px;border-radius:9px}
.gear[aria-pressed=true]{background:var(--bg2);color:var(--onbg)}

/* ---------- capture ---------- */
.cap{
  background:var(--card);border-radius:var(--r);padding:11px;
  display:flex;gap:9px;align-items:flex-end;box-shadow:0 2px 10px rgba(0,0,0,.16)
}
#box{
  flex:1;min-height:46px;max-height:190px;padding:11px 12px;resize:none;color:var(--ink);
  background:transparent;border:0;line-height:1.4
}
#box::placeholder{color:var(--mute)}
#box:focus{outline:0}
.iconbtn{
  width:44px;height:44px;flex:none;border-radius:11px;background:var(--card2);
  display:grid;place-items:center;font-size:17px;color:var(--ink)
}
.iconbtn.on{background:var(--tomato);color:#fff}
#add{height:44px;padding:0 19px;flex:none;border-radius:11px;background:var(--bg);color:var(--onbg);font-weight:600}
@media (prefers-color-scheme:dark){#add{background:var(--leaf);color:#0E1F13}}
#flash{font-size:13px;color:var(--onbg-dim);padding:8px 3px 0;min-height:0}
#flash b{color:var(--onbg)}

/* ---------- tabs ---------- */
nav{display:flex;gap:22px;padding:16px 3px 4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  padding:5px 0 8px;font:600 14px/1 var(--sans);letter-spacing:.02em;color:var(--onbg-dim);
  white-space:nowrap;border-bottom:2px solid transparent
}
nav button[aria-selected=true]{color:var(--onbg);border-bottom-color:var(--tomato)}

/* ---------- filters ---------- */
.filters{padding:12px 0 4px}
.frow{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;
  background:var(--bg2);color:var(--onbg-dim);white-space:nowrap;
  border:1px solid transparent;display:flex;align-items:center;gap:6px
}
.chip[aria-pressed=true]{background:var(--card);color:var(--ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}

/* ---------- sections ---------- */
h2.sec{
  font:600 11.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--onbg-dim);
  margin:22px 0 9px;display:flex;justify-content:space-between;align-items:baseline;gap:10px
}
h2.sec span{letter-spacing:.02em;text-transform:none;font-weight:500;font-size:12px}
h2.sec.late{color:var(--tomato)}
.list{display:flex;flex-direction:column;gap:7px}

/* ---------- task rows ---------- */
.row{background:var(--card);border-radius:var(--r);overflow:hidden;color:var(--ink)}
.row.over{box-shadow:inset 3px 0 0 var(--tomato)}
.rmain{display:flex;gap:11px;padding:13px 13px;align-items:flex-start}
.tick{
  width:24px;height:24px;flex:none;margin-top:2px;border-radius:50%;
  border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent
}
.tick:hover,.tick:active{border-color:var(--leaf);color:var(--leaf)}
.rbody{flex:1;min-width:0}
.rtitle{font-weight:600;line-height:1.35;word-wrap:break-word;font-size:15.5px}
.meta{display:flex;flex-wrap:wrap;gap:5px 7px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--mute)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.pill{background:var(--card2);border-radius:5px;padding:2px 7px;font-weight:600;font-size:11.5px;letter-spacing:.01em}
.pill.learn{color:var(--leaf)}
.pill.late{background:var(--tomato);color:#fff}
.more{width:28px;flex:none;align-self:stretch;color:var(--mute);font-size:18px;line-height:1}

/* ---------- done tray ---------- */
.tray{border-top:1px solid var(--line);padding:12px 13px;background:var(--card2)}
.tray p{margin:0 0 9px;font-size:12.5px;color:var(--mute)}
.mins{display:flex;flex-wrap:wrap;gap:6px}
.mins button{padding:8px 13px;border-radius:9px;background:var(--card);font-size:14px;font-weight:600;border:1px solid var(--line)}
.mins button.on{border-color:var(--leaf)}
.mins button.skip{color:var(--mute);font-weight:500}

/* ---------- editor ---------- */
.edit{border-top:1px solid var(--line);padding:13px;display:flex;flex-direction:column;gap:11px;background:var(--card2)}
.edit label{font:700 10.5px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:5px}
.edit input,.edit select{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.two{display:flex;gap:8px}.two>div{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{padding:6px 11px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.chips button[aria-pressed=true]{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.editfoot{display:flex;gap:8px;justify-content:space-between;align-items:center}
.save{padding:9px 18px;border-radius:9px;background:var(--bg);color:var(--onbg);font-weight:600}
@media (prefers-color-scheme:dark){.save{background:var(--leaf);color:#0E1F13}}
.del{color:var(--tomato);font-size:13.5px;font-weight:600}
.btn{padding:8px 13px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--ink)}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.calhead b{font:400 19px/1 var(--serif);letter-spacing:.03em;color:var(--onbg)}
.calnav{display:flex;gap:6px}
.calnav button{width:36px;height:34px;border-radius:9px;background:var(--bg2);color:var(--onbg);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.gh{text-align:center;font:600 10px/1 var(--sans);letter-spacing:.1em;color:var(--onbg-dim);padding-bottom:5px}
.cell{
  position:relative;aspect-ratio:1;border-radius:9px;background:var(--bg2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:12.5px;color:var(--onbg-dim);overflow:hidden
}
.cell.out{opacity:.25}
.cell.today{outline:1.5px solid var(--onbg-dim);outline-offset:-1.5px}
.cell[aria-pressed=true]{background:var(--card);color:var(--ink)}
.cell .n{font-weight:600;position:relative;z-index:2}
.cell .fill{position:absolute;left:0;right:0;bottom:0;background:var(--leaf);opacity:.55;z-index:1}
.cell .marks{display:flex;gap:2px;position:relative;z-index:2}
.cell .m{width:4px;height:4px;border-radius:50%}
.m.done{background:var(--onbg)}
.m.due{background:var(--tomato)}
.cell[aria-pressed=true] .m.done{background:var(--leaf)}
.dayhead{font:400 17px/1 var(--serif);color:var(--onbg);margin:20px 0 9px}

/* ---------- review ---------- */
.stats{display:flex;gap:7px;margin-bottom:6px}
.stat{flex:1;background:var(--card);border-radius:var(--r);padding:13px 10px;text-align:center;color:var(--ink)}
.stat b{display:block;font:400 25px/1.1 var(--serif)}
.stat span{font-size:11px;color:var(--mute);display:block;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:4px;height:96px;background:var(--card);border-radius:var(--r);padding:11px 11px 7px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bfill{width:100%;background:var(--leaf);border-radius:3px;min-height:2px}
.blab{font-size:9.5px;color:var(--mute)}
table.t{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden;color:var(--ink)}
table.t td,table.t th{padding:10px 12px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
table.t th{font:700 10.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
table.t tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.bad{color:var(--tomato);font-weight:600}
.donerow{display:flex;gap:10px;align-items:center;padding:11px 13px;background:var(--card);border-radius:var(--r);color:var(--ink)}
.donerow .rtitle{font-weight:500;font-size:14.5px;flex:1}
.undo{font-size:12px;color:var(--mute);font-weight:600}

/* ---------- misc ---------- */
.empty{text-align:center;color:var(--onbg-dim);padding:38px 20px;font-size:14.5px;line-height:1.6}
.card{background:var(--card);border-radius:var(--r);padding:15px;margin-bottom:9px;color:var(--ink)}
.card h3{margin:0 0 9px;font:400 17px/1.2 var(--serif)}
.card p{margin:0 0 9px;font-size:13.5px;color:var(--mute);line-height:1.5}
.card code{background:var(--card2);padding:2px 6px;border-radius:5px;font-size:12px;word-break:break-all}
.catline{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.catline:last-child{border-bottom:0}
.catline b{flex:1;font-weight:600}
.catline span{color:var(--mute);font-size:12.5px}
footer{padding:30px 0 20px;text-align:center;color:var(--onbg-dim);font-size:11.5px;letter-spacing:.03em}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="mark">Slate</div>
    <button class="gear" id="gear" aria-pressed="false" title="Setup">&#9881;</button>
  </div>

  <div class="cap">
    <textarea id="box" rows="1" placeholder="Anything. One per line."></textarea>
    <button class="iconbtn" id="mic" title="Speak" hidden>&#127908;</button>
    <button id="add">Add</button>
  </div>
  <div id="flash"></div>

  <nav id="tabs">
    <button data-v="today" aria-selected="true">To do</button>
    <button data-v="list" aria-selected="false">By category</button>
    <button data-v="cal" aria-selected="false">Calendar</button>
    <button data-v="review" aria-selected="false">Review</button>
  </nav>

  <main>
    <section id="v-today"></section>
    <section id="v-list" hidden></section>
    <section id="v-cal" hidden></section>
    <section id="v-review" hidden></section>
    <section id="v-setup" hidden></section>
  </main>

  <footer id="foot"></footer>
</div>

<script>
(function(){
"use strict";

var API = "https://npjzhuqggkbbwidghrjr.supabase.co/functions/v1/api";
var qk = new URLSearchParams(location.search).get("k");
if (qk) { try { localStorage.setItem("slate_key", qk); } catch(e){} }
var KEY = qk || (function(){ try { return localStorage.getItem("slate_key"); } catch(e){ return null; } })() || "";

var S = { today:"", tasks:[], categories:[], recent:[], category_history:[], avoidance:[], settings:{} };
var view = "today";
var timeCap = 0;
var catFilter = "";
var calMonth = null;      // "YYYY-MM"
var calDay = null;
var openTray = null, openEdit = null, busy = false;

var $ = function(s){ return document.querySelector(s); };
var box = $("#box"), flash = $("#flash");

/* ---------------- helpers ---------------- */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function d2n(s){ var p = String(s).slice(0,10).split("-"); return Date.UTC(+p[0], +p[1]-1, +p[2]); }
function n2d(n){ return new Date(n).toISOString().slice(0,10); }
function addDays(s,n){ return n2d(d2n(s) + n*86400000); }
function diffDays(a,b){ return Math.round((d2n(a) - d2n(b)) / 86400000); }
function monthOf(s){ return s.slice(0,7); }
function firstOf(m){ return m + "-01"; }
function shiftMonth(m,n){
  var y = +m.slice(0,4), mo = +m.slice(5,7) - 1 + n;
  y += Math.floor(mo/12); mo = ((mo%12)+12)%12;
  return y + "-" + String(mo+1).padStart(2,"0");
}
function daysIn(m){ return new Date(Date.UTC(+m.slice(0,4), +m.slice(5,7), 0)).getUTCDate(); }
function dow(s){ return new Date(d2n(s)).getUTCDay(); }

function fmtMins(m){
  m = Math.round(m || 0);
  if (m < 60) return m + "m";
  var h = Math.floor(m/60), r = m % 60;
  return r ? h + "h " + r + "m" : h + "h";
}
function agoWords(dateStr, today){
  if (!dateStr) return "never done";
  var d = diffDays(today, dateStr);
  if (d === 0) return "done today";
  if (d === 1) return "yesterday";
  if (d < 7) return d + " days ago";
  if (d < 14) return "a week ago";
  if (d < 60) return Math.round(d/7) + " weeks ago";
  return Math.round(d/30) + " months ago";
}
function dueWords(dateStr, today){
  if (!dateStr) return "";
  var d = diffDays(dateStr, today);
  if (d < -1) return Math.abs(d) + " days late";
  if (d === -1) return "1 day late";
  if (d === 0) return "today";
  if (d === 1) return "tomorrow";
  if (d < 7) return "in " + d + " days";
  return new Date(d2n(dateStr)).toLocaleDateString(undefined,{month:"short",day:"numeric",timeZone:"UTC"});
}
function eff(t){ return (t.times_timed >= 2 && t.avg_actual) ? t.avg_actual : t.estimate_minutes; }
function isLearned(t){ return t.times_timed >= 2 && t.avg_actual != null; }
function minsOf(c){ return c.actual_minutes != null ? c.actual_minutes : (c.estimate_minutes || 0); }

function say(html, sticky){
  flash.innerHTML = html;
  if (!sticky) { clearTimeout(say._t); say._t = setTimeout(function(){ flash.innerHTML=""; }, 4000); }
}

/* ---------------- api ---------------- */
function api(payload){
  return fetch(API, {
    method:"POST",
    headers:{ "content-type":"application/json", "x-tide-key":KEY },
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json().then(function(j){
    if (!r.ok) throw new Error(j.error || ("http " + r.status));
    return j;
  }); });
}
function load(){
  return api({ action:"state" }).then(function(j){
    S = j;
    if (!calMonth) calMonth = monthOf(S.today);
    render();
  }).catch(function(e){
    $("#v-today").innerHTML = '<div class="empty">Could not load.<br>' + esc(e.message) + "</div>";
  });
}

/* ---------------- capture ---------------- */
function submit(){
  var text = box.value.trim();
  if (!text || busy) return;
  busy = true; say("Adding…", true);
  var multi = /\r?\n/.test(text);
  api({ action: multi ? "dump" : "capture", text:text, source:"app" })
    .then(function(j){
      box.value = ""; box.style.height = "auto";
      var t = j.titles || [];
      say(t.length === 1 ? "Added <b>" + esc(t[0]) + "</b>" : "Added <b>" + t.length + "</b> things");
      return load();
    })
    .catch(function(e){ say("Didn't save: " + esc(e.message)); })
    .then(function(){ busy = false; });
}
$("#add").onclick = submit;
box.addEventListener("input", function(){
  box.style.height = "auto";
  box.style.height = Math.min(190, box.scrollHeight) + "px";
});
box.addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey && !/\n/.test(box.value)) { e.preventDefault(); submit(); }
});

var SRec = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SRec) {
  var mic = $("#mic"), rec = null, listening = false;
  mic.hidden = false;
  mic.onclick = function(){
    if (listening && rec) { rec.stop(); return; }
    rec = new SRec();
    rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true;
    rec.onstart = function(){ listening = true; mic.classList.add("on"); say("Listening…", true); };
    rec.onresult = function(e){
      var fin = "", mid = "";
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) fin += e.results[i][0].transcript; else mid += e.results[i][0].transcript;
      }
      if (fin) box.value = (box.value ? box.value + " " : "") + fin.trim();
      say(mid ? esc(mid) : "Listening…", true);
      box.dispatchEvent(new Event("input"));
    };
    rec.onerror = function(e){ say("Mic: " + esc(e.error)); };
    rec.onend = function(){ listening = false; mic.classList.remove("on"); say(""); };
    rec.start();
  };
}

/* ---------------- rows ---------------- */
function bucketOf(t, today){
  var d = t.next_due_on || t.due_on;
  if (!d) return "anytime";
  if (d < today) return "overdue";
  if (d === today) return "today";
  if (diffDays(d, today) <= 7) return "soon";
  return "later";
}
function rowHTML(t){
  var today = S.today, e = eff(t), b = bucketOf(t, today);
  var due = t.next_due_on || t.due_on, bits = [];
  if (due) bits.push('<span class="pill' + (b==="overdue" ? " late" : "") + '">' + esc(dueWords(due, today)) + "</span>");
  bits.push('<span class="pill' + (isLearned(t) ? " learn" : "") + '">' + fmtMins(e) + (isLearned(t) ? " usually" : "") + "</span>");
  if (t.recur_mode) bits.push("&#8635; " + esc(agoWords(t.last_done_on, today)));

  return '<div class="row' + (b === "overdue" ? " over" : "") + '" data-id="' + t.id + '">' +
    '<div class="rmain">' +
      '<button class="tick" data-act="tray" title="Done">&#10003;</button>' +
      '<div class="rbody" data-act="edit">' +
        '<div class="rtitle">' + esc(t.title) + "</div>" +
        '<div class="meta">' +
          '<span class="dot" style="background:' + esc(t.category_color || "#8A8F80") + '"></span>' +
          esc(t.category_name || "Unsorted") + bits.join("") +
        "</div></div>" +
      '<button class="more" data-act="edit" title="Edit">&#8230;</button>' +
    "</div>" +
    (openTray === t.id ? trayHTML(t) : "") +
    (openEdit === t.id ? editHTML(t) : "") +
  "</div>";
}
function trayHTML(t){
  var opts = [2,5,10,15,20,30,45,60,90,120], guess = eff(t);
  return '<div class="tray"><p>How long did that actually take?</p><div class="mins">' +
    opts.map(function(m){
      return '<button data-act="done" data-m="' + m + '"' + (m === guess ? ' class="on"' : "") + ">" + fmtMins(m) + "</button>";
    }).join("") +
    '<button class="skip" data-act="done" data-m="">no idea</button></div></div>';
}
function editHTML(t){
  var cats = S.categories.map(function(c){
    return '<option value="' + c.id + '"' + (c.id === t.category_id ? " selected" : "") + ">" + esc(c.name) + "</option>";
  }).join("");
  var mode = t.recur_mode || "", iv = t.recur_interval_days || 7, rule = t.recur_rule || "weekly:1";
  var dayChips = ["S","M","T","W","T","F","S"].map(function(d,i){
    var on = mode === "fixed" && /^weekly:/.test(rule) && rule.slice(7).split(",").indexOf(String(i)) > -1;
    return '<button data-act="wday" data-i="' + i + '" aria-pressed="' + on + '">' + d + "</button>";
  }).join("");
  var mday = (mode === "fixed" && /^monthly:/.test(rule)) ? rule.slice(8) : "1";
  var fixKind = /^daily/.test(rule) ? "daily" : (/^monthly:/.test(rule) ? "monthly" : "weekly");

  return '<div class="edit">' +
    '<div><label>Title</label><input data-f="title" value="' + esc(t.title) + '"></div>' +
    '<div class="two">' +
      '<div><label>Category</label><select data-f="category_id">' + cats + "</select></div>" +
      '<div><label>Minutes</label><input data-f="estimate_minutes" type="number" inputmode="numeric" min="1" value="' + (t.estimate_minutes||15) + '"></div>' +
    "</div>" +
    '<div><label>Due</label><input data-f="due_on" type="date" value="' + esc(t.due_on || "") + '"></div>' +
    '<div><label>Repeats</label><select data-f="recur_mode">' +
      '<option value=""' + (mode === "" ? " selected" : "") + ">One-off</option>" +
      '<option value="floating"' + (mode === "floating" ? " selected" : "") + ">N days after I last did it</option>" +
      '<option value="fixed"' + (mode === "fixed" ? " selected" : "") + ">Fixed schedule</option>" +
    "</select></div>" +
    '<div data-blk="floating"' + (mode === "floating" ? "" : " hidden") + '><label>Days between</label>' +
      '<input data-f="recur_interval_days" type="number" inputmode="numeric" min="1" value="' + iv + '">' +
      '<div class="chips" style="margin-top:6px">' +
        [1,3,7,14,30,42,90,180,365].map(function(n){
          return '<button data-act="iv" data-n="' + n + '">' + (n<14 ? n+"d" : n<60 ? Math.round(n/7)+"w" : Math.round(n/30)+"mo") + "</button>";
        }).join("") + "</div></div>" +
    '<div data-blk="fixed"' + (mode === "fixed" ? "" : " hidden") + '><label>Schedule</label>' +
      '<select data-f="fixkind">' +
        '<option value="daily"' + (fixKind==="daily"?" selected":"") + ">Every day</option>" +
        '<option value="weekly"' + (fixKind==="weekly"?" selected":"") + ">Certain weekdays</option>" +
        '<option value="monthly"' + (fixKind==="monthly"?" selected":"") + ">Day of the month</option>" +
      "</select>" +
      '<div class="chips" data-blk="wdays" style="margin-top:6px"' + (fixKind==="weekly"?"":" hidden") + ">" + dayChips + "</div>" +
      '<div data-blk="mday" style="margin-top:6px"' + (fixKind==="monthly"?"":" hidden") + '>' +
        '<input data-f="mday" type="number" inputmode="numeric" min="1" max="31" value="' + esc(mday) + '"></div>' +
    "</div>" +
    '<div class="editfoot"><button class="del" data-act="del">Delete</button><div>' +
      '<button class="btn" data-act="snooze" data-d="1">+1d</button> ' +
      '<button class="btn" data-act="snooze" data-d="7">+1w</button> ' +
      '<button class="save" data-act="save">Save</button></div></div>' +
  "</div>";
}
function section(title, note, rows, cls){
  if (!rows.length) return "";
  return '<h2 class="sec' + (cls ? " " + cls : "") + '">' + esc(title) + (note ? "<span>" + esc(note) + "</span>" : "") + "</h2>" +
         '<div class="list">' + rows.map(rowHTML).join("") + "</div>";
}
function totalWords(rows){
  if (!rows.length) return "";
  var m = rows.reduce(function(a,t){ return a + eff(t); }, 0);
  return rows.length + " · " + fmtMins(m);
}

/* ---------------- filters ---------------- */
function filterBar(){
  var times = [[5,"5 min"],[15,"15 min"],[30,"30 min"],[60,"An hour"],[0,"Any time"]];
  var used = {};
  S.tasks.forEach(function(t){ used[t.category_name || "Unsorted"] = t.category_color; });
  var cats = S.categories.filter(function(c){ return used[c.name]; });

  return '<div class="filters">' +
    '<div class="frow" data-f="time">' + times.map(function(p){
      return '<button class="chip" data-m="' + p[0] + '" aria-pressed="' + (timeCap === p[0]) + '">' + p[1] + "</button>";
    }).join("") + "</div>" +
    (cats.length > 1 ? '<div class="frow" data-f="cat">' +
      '<button class="chip" data-c="" aria-pressed="' + (catFilter === "") + '">Everything</button>' +
      cats.map(function(c){
        return '<button class="chip" data-c="' + esc(c.name) + '" aria-pressed="' + (catFilter === c.name) + '">' +
          '<span class="dot" style="background:' + esc(c.color) + '"></span>' + esc(c.name) + "</button>";
      }).join("") + "</div>" : "") +
  "</div>";
}
function pool(){
  return S.tasks.filter(function(t){
    if (timeCap && eff(t) > timeCap) return false;
    if (catFilter && (t.category_name || "Unsorted") !== catFilter) return false;
    return true;
  });
}

/* ---------------- views ---------------- */
function renderToday(){
  var today = S.today, p = pool();
  var g = { overdue:[], today:[], soon:[], anytime:[], later:[] };
  p.forEach(function(t){ g[bucketOf(t, today)].push(t); });
  g.anytime.sort(function(a,b){ return eff(a) - eff(b); });

  var body =
    section("Late", totalWords(g.overdue), g.overdue, "late") +
    section("Today", totalWords(g.today), g.today) +
    section("This week", totalWords(g.soon), g.soon) +
    section("Whenever", totalWords(g.anytime), g.anytime) +
    section("Later on", totalWords(g.later), g.later);

  if (!body) {
    body = '<div class="empty">' + (timeCap || catFilter
      ? "Nothing matches that filter."
      : "Nothing on the list.<br>Put something in the box above.") + "</div>";
  }
  $("#v-today").innerHTML = filterBar() + body;
}

function renderList(){
  var p = pool(), byCat = {};
  p.forEach(function(t){ var k = t.category_name || "Unsorted"; (byCat[k] = byCat[k] || []).push(t); });
  var body = S.categories.map(function(c){ return c.name; }).filter(function(n){ return byCat[n]; }).map(function(n){
    var rows = byCat[n].slice().sort(function(a,b){
      var ad = a.next_due_on || a.due_on || "9999", bd = b.next_due_on || b.due_on || "9999";
      return ad < bd ? -1 : ad > bd ? 1 : 0;
    });
    return section(n, totalWords(rows), rows);
  }).join("");
  $("#v-list").innerHTML = filterBar() + (body || '<div class="empty">Nothing matches that filter.</div>');
}

function renderCal(){
  var today = S.today, m = calMonth || monthOf(today);
  var doneBy = {}, dueBy = {};
  (S.recent || []).forEach(function(c){ (doneBy[c.done_on] = doneBy[c.done_on] || []).push(c); });
  S.tasks.forEach(function(t){
    var d = t.next_due_on || t.due_on;
    if (d) (dueBy[d] = dueBy[d] || []).push(t);
  });

  var first = firstOf(m), lead = dow(first), n = daysIn(m);
  var maxMin = 1;
  Object.keys(doneBy).forEach(function(d){
    if (monthOf(d) === m) {
      var s = doneBy[d].reduce(function(a,c){ return a + minsOf(c); }, 0);
      if (s > maxMin) maxMin = s;
    }
  });

  var cells = "";
  for (var i = 0; i < lead; i++) {
    var pd = addDays(first, i - lead);
    cells += '<div class="cell out"><span class="n">' + (+pd.slice(8,10)) + "</span></div>";
  }
  for (var d = 1; d <= n; d++) {
    var ds = m + "-" + String(d).padStart(2,"0");
    var dn = doneBy[ds] || [], du = dueBy[ds] || [];
    var mins = dn.reduce(function(a,c){ return a + minsOf(c); }, 0);
    var h = mins ? Math.max(14, Math.round(mins / maxMin * 100)) : 0;
    var marks = "";
    if (dn.length) marks += '<span class="m done"></span>';
    if (du.length) marks += '<span class="m due"></span>';
    cells += '<button class="cell' + (ds === today ? " today" : "") + '" data-act="day" data-d="' + ds + '"' +
      ' aria-pressed="' + (calDay === ds) + '">' +
      (h ? '<span class="fill" style="height:' + h + '%"></span>' : "") +
      '<span class="n">' + d + "</span>" +
      '<span class="marks">' + marks + "</span></button>";
  }
  var tail = (7 - ((lead + n) % 7)) % 7;
  for (var j = 1; j <= tail; j++) cells += '<div class="cell out"><span class="n">' + j + "</span></div>";

  var label = new Date(d2n(first)).toLocaleDateString(undefined,{month:"long",year:"numeric",timeZone:"UTC"});
  var head = '<div class="calhead"><b>' + esc(label) + "</b><div class=\"calnav\">" +
    '<button data-act="mon" data-n="-1">&#8249;</button>' +
    '<button data-act="mon" data-n="1">&#8250;</button></div></div>';
  var ghs = ["S","M","T","W","T","F","S"].map(function(x){ return '<div class="gh">' + x + "</div>"; }).join("");

  var detail = "";
  if (calDay) {
    var dn2 = doneBy[calDay] || [], du2 = dueBy[calDay] || [];
    var nice = new Date(d2n(calDay)).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",timeZone:"UTC"});
    detail = '<div class="dayhead">' + esc(nice) + "</div>";
    if (!dn2.length && !du2.length) detail += '<div class="empty">Nothing done, nothing due.</div>';
    if (dn2.length) detail += '<h2 class="sec">Finished<span>' + fmtMins(dn2.reduce(function(a,c){return a+minsOf(c);},0)) + "</span></h2>" +
      '<div class="list">' + dn2.map(function(c){
        return '<div class="donerow"><div class="rtitle">' + esc(c.title) +
          '<div class="meta"><span class="pill">' + (c.actual_minutes == null ? "not timed" : fmtMins(c.actual_minutes)) + "</span></div></div></div>";
      }).join("") + "</div>";
    if (du2.length) detail += '<h2 class="sec">Due</h2><div class="list">' + du2.map(rowHTML).join("") + "</div>";
  }

  $("#v-cal").innerHTML = head + '<div class="grid">' + ghs + cells + "</div>" + detail;
}

function renderReview(){
  var today = S.today, r = S.recent || [];
  var todayRows = r.filter(function(c){ return c.done_on === today; });
  var days = {}; r.forEach(function(c){ days[c.done_on] = true; });
  var streak = 0, cur = days[today] ? today : addDays(today, -1);
  while (days[cur]) { streak++; cur = addDays(cur, -1); }

  var html = '<div class="stats">' +
    '<div class="stat"><b>' + todayRows.length + "</b><span>done today</span></div>" +
    '<div class="stat"><b>' + fmtMins(todayRows.reduce(function(a,c){return a+minsOf(c);},0)) + "</b><span>logged today</span></div>" +
    '<div class="stat"><b>' + streak + "</b><span>day streak</span></div></div>";

  var bars = [], max = 1;
  for (var i = 13; i >= 0; i--) {
    var d = addDays(today, -i);
    var mn = r.filter(function(c){ return c.done_on === d; }).reduce(function(a,c){ return a + minsOf(c); }, 0);
    if (mn > max) max = mn;
    bars.push({ d:d, m:mn });
  }
  html += '<h2 class="sec">Last two weeks<span>' + fmtMins(bars.reduce(function(a,b){return a+b.m;},0)) + "</span></h2>" +
    '<div class="bars">' + bars.map(function(b){
      var h = Math.max(2, Math.round(b.m / max * 68));
      var lab = new Date(d2n(b.d)).toLocaleDateString(undefined,{weekday:"narrow",timeZone:"UTC"});
      return '<div class="bcol" title="' + b.d + ": " + fmtMins(b.m) + '"><div class="bfill" style="height:' + h + 'px"></div>' +
             '<div class="blab">' + esc(lab) + "</div></div>";
    }).join("") + "</div>";

  var av = (S.avoidance || []).filter(function(a){ return a.avg_days_late != null && a.avg_days_late > 0; });
  if (av.length) {
    html += '<h2 class="sec">What you put off longest<span>days past due</span></h2><table class="t">' +
      '<tr><th>Task</th><th class="num">Avg late</th><th class="num">Worst</th></tr>' +
      av.slice(0,12).map(function(a){
        return "<tr><td>" + esc(a.title) + '</td><td class="num bad">' + a.avg_days_late + '</td><td class="num">' + (a.worst_days_late != null ? a.worst_days_late : "—") + "</td></tr>";
      }).join("") + "</table>";
  }

  var timed = (S.avoidance || []).filter(function(a){ return a.avg_actual != null; });
  if (timed.length) {
    html += '<h2 class="sec">How long things really take<span>you vs your guess</span></h2><table class="t">' +
      '<tr><th>Task</th><th class="num">Actually</th><th class="num">Guessed</th></tr>' +
      timed.slice(0,12).map(function(a){
        var off = a.avg_estimate && Math.abs(a.avg_actual - a.avg_estimate) >= Math.max(5, a.avg_estimate * .3);
        return "<tr><td>" + esc(a.title) + '</td><td class="num' + (off ? " bad" : "") + '">' + fmtMins(a.avg_actual) +
               '</td><td class="num">' + (a.avg_estimate ? fmtMins(a.avg_estimate) : "—") + "</td></tr>";
      }).join("") + "</table>";
  }

  var ch = (S.category_history || []).filter(function(c){ return c.samples > 0; });
  if (ch.length) {
    html += '<h2 class="sec">By category</h2><table class="t">' +
      '<tr><th>Category</th><th class="num">Average</th><th class="num">Times</th></tr>' +
      ch.sort(function(a,b){ return b.samples - a.samples; }).map(function(c){
        return "<tr><td>" + esc(c.name) + '</td><td class="num">' + fmtMins(c.avg_actual) + '</td><td class="num">' + c.samples + "</td></tr>";
      }).join("") + "</table>";
  }

  html += '<h2 class="sec">Recently done</h2>';
  if (!r.length) html += '<div class="empty">Nothing logged yet.<br>Tick something off and it lands here.</div>';
  else html += '<div class="list">' + r.slice(0,50).map(function(c){
    var est = c.estimate_minutes, act = c.actual_minutes;
    var note = act == null ? "not timed"
      : (est && Math.abs(act - est) >= Math.max(5, est * .3) ? fmtMins(act) + " (guessed " + fmtMins(est) + ")" : fmtMins(act));
    return '<div class="donerow" data-cid="' + c.id + '"><div class="rtitle">' + esc(c.title) +
      '<div class="meta">' + esc(agoWords(c.done_on, today)) + ' <span class="pill">' + esc(note) + "</span>" +
      (c.days_late > 0 ? ' <span class="pill late">' + c.days_late + "d late</span>" : "") +
      "</div></div><button class=\"undo\" data-act=\"undo\">undo</button></div>";
  }).join("") + "</div>";

  $("#v-review").innerHTML = html;
}

function renderSetup(){
  var counts = {};
  S.tasks.forEach(function(t){ var k = t.category_name || "Unsorted"; counts[k] = (counts[k]||0)+1; });
  var hist = {}; (S.category_history||[]).forEach(function(c){ hist[c.name] = c; });
  var unsorted = S.tasks.filter(function(t){ return t.category_name === "Unsorted"; }).length;

  $("#v-setup").innerHTML =
    '<div class="card"><h3>Categories</h3>' + S.categories.map(function(c){
      var h = hist[c.name];
      return '<div class="catline"><span class="dot" style="background:' + esc(c.color) + '"></span><b>' + esc(c.name) + "</b>" +
        "<span>" + (counts[c.name]||0) + " open" + (h && h.samples ? " · usually " + fmtMins(h.avg_actual) : "") + "</span></div>";
    }).join("") + "</div>" +
    '<div class="card"><h3>Unsorted</h3><p>' + unsorted + " item" + (unsorted===1?"":"s") +
      " haven't matched a rule yet.</p><button class=\"btn\" id=\"resort\">Sort them now</button></div>" +
    '<div class="card"><h3>This device</h3>' +
      "<p>Home screen: Share → Add to Home Screen.</p>" +
      "<p>Set up another device with this link:<br><code>" + esc(location.origin + location.pathname + "?k=" + KEY) + "</code></p>" +
      '<button class="btn" id="forget">Sign out here</button></div>';

  var rs = $("#resort");
  if (rs) rs.onclick = function(){
    rs.textContent = "Sorting…";
    api({ action:"resort" }).then(function(j){ say("Sorted <b>" + j.sorted + "</b>"); return load(); })
      .catch(function(e){ say(esc(e.message)); });
  };
  var fg = $("#forget");
  if (fg) fg.onclick = function(){
    if (!confirm("Sign out of Slate on this device?")) return;
    try { localStorage.removeItem("slate_key"); } catch(e){}
    location.replace(location.pathname);
  };
}

function render(){
  ["today","list","cal","review","setup"].forEach(function(v){ $("#v-" + v).hidden = (v !== view); });
  $("#gear").setAttribute("aria-pressed", String(view === "setup"));
  [].forEach.call($("#tabs").children, function(x){ x.setAttribute("aria-selected", String(x.dataset.v === view)); });
  if (view === "today") renderToday();
  if (view === "list") renderList();
  if (view === "cal") renderCal();
  if (view === "review") renderReview();
  if (view === "setup") renderSetup();
  var mins = S.tasks.reduce(function(a,t){ return a + eff(t); }, 0);
  $("#foot").textContent = S.tasks.length + " open · " + fmtMins(mins);
}

/* ---------------- interaction ---------------- */
$("#tabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-v]");
  if (!b) return;
  view = b.dataset.v; openTray = openEdit = null; render();
});
$("#gear").onclick = function(){
  view = (view === "setup") ? "today" : "setup";
  openTray = openEdit = null; render();
};

function currentEdit(row){
  var get = function(f){ var el = row.querySelector('[data-f="' + f + '"]'); return el ? el.value : null; };
  var mode = get("recur_mode");
  var patch = {
    title: get("title"), category_id: get("category_id"),
    estimate_minutes: Math.max(1, +get("estimate_minutes") || 15),
    due_on: get("due_on") || null,
    recur_mode: mode || null, recur_interval_days: null, recur_rule: null
  };
  if (mode === "floating") patch.recur_interval_days = Math.max(1, +get("recur_interval_days") || 7);
  if (mode === "fixed") {
    var kind = get("fixkind");
    if (kind === "daily") patch.recur_rule = "daily";
    else if (kind === "monthly") patch.recur_rule = "monthly:" + Math.min(31, Math.max(1, +get("mday") || 1));
    else {
      var ds = [].filter.call(row.querySelectorAll('[data-act="wday"]'), function(b){
        return b.getAttribute("aria-pressed") === "true";
      }).map(function(b){ return b.dataset.i; });
      patch.recur_rule = "weekly:" + (ds.length ? ds.join(",") : "1");
    }
  }
  return patch;
}

document.addEventListener("click", function(e){
  var chip = e.target.closest(".frow .chip");
  if (chip) {
    if (chip.parentNode.dataset.f === "time") timeCap = +chip.dataset.m;
    else catFilter = chip.dataset.c;
    render();
    return;
  }
  var btn = e.target.closest("[data-act]");
  if (!btn) return;
  var act = btn.dataset.act, row = btn.closest(".row"), id = row ? row.dataset.id : null;

  if (act === "mon") { calMonth = shiftMonth(calMonth, +btn.dataset.n); calDay = null; renderCal(); return; }
  if (act === "day") { calDay = (calDay === btn.dataset.d) ? null : btn.dataset.d; renderCal(); return; }
  if (act === "tray") { openTray = (openTray === id) ? null : id; openEdit = null; render(); return; }
  if (act === "edit") { openEdit = (openEdit === id) ? null : id; openTray = null; render(); return; }

  if (act === "done") {
    if (busy) return; busy = true;
    var m = btn.dataset.m; openTray = null;
    api({ action:"complete", id:id, actual_minutes: m === "" ? null : +m })
      .then(function(j){ say(j.next_due_on ? "Logged. Back <b>" + esc(dueWords(j.next_due_on, S.today)) + "</b>" : "Logged."); return load(); })
      .catch(function(err){ say(esc(err.message)); })
      .then(function(){ busy = false; });
    return;
  }
  if (act === "snooze") {
    api({ action:"snooze", id:id, days:+btn.dataset.d })
      .then(function(){ openEdit = null; return load(); }).catch(function(err){ say(esc(err.message)); });
    return;
  }
  if (act === "del") {
    if (!confirm("Delete this for good?")) return;
    api({ action:"delete_task", id:id })
      .then(function(){ openEdit = null; say("Deleted."); return load(); }).catch(function(err){ say(esc(err.message)); });
    return;
  }
  if (act === "save") {
    var patch = currentEdit(row); patch.action = "update_task"; patch.id = id;
    api(patch).then(function(){ openEdit = null; say("Saved."); return load(); }).catch(function(err){ say(esc(err.message)); });
    return;
  }
  if (act === "iv") {
    var inp = row.querySelector('[data-f="recur_interval_days"]');
    if (inp) inp.value = btn.dataset.n;
    return;
  }
  if (act === "wday") {
    btn.setAttribute("aria-pressed", btn.getAttribute("aria-pressed") === "true" ? "false" : "true");
    return;
  }
  if (act === "undo") {
    var cid = btn.closest(".donerow").dataset.cid;
    api({ action:"undo", completion_id:cid })
      .then(function(){ say("Put back."); return load(); }).catch(function(err){ say(esc(err.message)); });
    return;
  }
});

document.addEventListener("change", function(e){
  var el = e.target, row = el.closest(".row");
  if (!row) return;
  if (el.dataset.f === "recur_mode") {
    var f = row.querySelector('[data-blk="floating"]'), x = row.querySelector('[data-blk="fixed"]');
    if (f) f.hidden = el.value !== "floating";
    if (x) x.hidden = el.value !== "fixed";
  }
  if (el.dataset.f === "fixkind") {
    var w = row.querySelector('[data-blk="wdays"]'), mm = row.querySelector('[data-blk="mday"]');
    if (w) w.hidden = el.value !== "weekly";
    if (mm) mm.hidden = el.value !== "monthly";
  }
});

document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(); });

if (!KEY) {
  $("#v-today").innerHTML =
    '<div class="empty" style="text-align:left">' +
      '<p style="margin:0 0 12px"><b>One-time setup on this device.</b><br>Paste your Slate key. It stays in this browser.</p>' +
      '<div style="display:flex;gap:8px">' +
        '<input id="keyin" type="password" autocomplete="off" placeholder="key" ' +
          'style="flex:1;padding:11px 12px;border-radius:10px;border:0;background:var(--card);color:var(--ink)">' +
        '<button class="save" id="keygo">Unlock</button></div></div>';
  $("#keygo").onclick = function(){
    var v = $("#keyin").value.trim();
    if (!v) return;
    try { localStorage.setItem("slate_key", v); } catch(e){}
    location.replace(location.pathname);
  };
  $("#keyin").addEventListener("keydown", function(e){ if (e.key === "Enter") $("#keygo").click(); });
} else {
  load();
}
})();
</script>
</body>
</html>
